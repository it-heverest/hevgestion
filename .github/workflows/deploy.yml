name: Deploy Fullstack HevGestion

on:
  push:
    branches: [prod]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # --- ETAPE FRONTEND ---
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Deploy Frontend to Nginx
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/hevgestion"
          strip_components: 1

      # --- ETAPE BACKEND (Si tu as aussi un dossier de build backend) ---
      # Si ton backend est dans le même repo, tu dois aussi envoyer son dossier 'dist'
      - name: Deploy Backend Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend_utils/dist/*" # Adapte ce chemin selon ton projet
          target: "/home/it/backend_utils/dist"
          strip_components: 2

      - name: Restart Services on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Recharger Nginx pour le Frontend
            sudo systemctl reload nginx
            # Mettre à jour et redémarrer le Backend
            cd ~/backend_utils
            npm install --production
            pm2 restart hevgestion-api || pm2 start dist/index.js --name hevgestion-api
